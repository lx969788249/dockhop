name: apps

# 两台模拟服务器之间迁移真实应用（test/apps/）。每个场景单独一个任务、同时运行；
# 每周再跑一次，及早发现上游镜像更新带来的问题。
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      app:
        description: 只跑某一个场景（留空 = 全部）
        required: false
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 只用 include 列出每个任务：同一个应用的不同 Docker 版本组合才不会被合并成一个任务。
      matrix:
        include:
          - { app: wordpress }
          - { app: nextcloud }
          - { app: gitea }
          - { app: vaultwarden }
          - { app: uptime-kuma }
          - { app: halo }
          - { app: memos }
          - { app: tricky }
          - { app: unreachable }
          - { app: digest }
          # Docker 29：默认用 containerd 存储，镜像 ID、导出、docker diff 的行为都和以前不同。
          - { app: tricky, old: "29", new: "29" }
          - { app: wordpress, old: "29", new: "29" }
          - { app: digest, old: "29", new: "29" }
          # 不同 Docker 版本之间迁移：老版本 → 新版本、新版本 → 老版本。
          - { app: tricky, old: "20.10", new: "29" }
          - { app: tricky, old: "29", new: "20.10" }
          - { app: tricky, old: "20.10", new: "27.5" }
          - { app: tricky, old: "27.5", new: "20.10" }
          - { app: wordpress, old: "20.10", new: "27.5" }
          - { app: memos, old: "27.5", new: "20.10" }
    name: ${{ matrix.app }}${{ matrix.old && format(' ({0} → {1})', matrix.old, matrix.new) || '' }}
    steps:
      - uses: actions/checkout@v5
        if: inputs.app == '' || inputs.app == matrix.app
      - uses: actions/setup-go@v6
        if: inputs.app == '' || inputs.app == matrix.app
        with:
          go-version-file: go.mod
      - name: 迁移 ${{ matrix.app }}
        if: inputs.app == '' || inputs.app == matrix.app
        run: test/apps/run.sh "${{ matrix.app }}"
        env:
          OLD_DOCKER: ${{ matrix.old || '27.5' }}
          NEW_DOCKER: ${{ matrix.new || '27.5' }}
          DOCKHOP_APPS_ARTIFACTS: ${{ runner.temp }}/apps-logs
      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.app }}-${{ matrix.old || 'same' }}-${{ matrix.new || 'same' }}
          path: ${{ runner.temp }}/apps-logs
          if-no-files-found: ignore
